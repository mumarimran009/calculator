<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="calculator" aria-label="Calculator">

    <section class="display" aria-live="polite">
      <div class="display__history" id="history"></div>
      <div class="display__value" id="output">0</div>
    </section>

    <section class="keys" id="keys">
      <button class="key key--function" data-action="clear">AC</button>
      <button class="key key--function" data-action="backspace">⌫</button>
      <button class="key key--function" data-action="percent">%</button>
      <button class="key key--operator" data-action="divide">÷</button>

      <button class="key key--digit" data-digit="7">7</button>
      <button class="key key--digit" data-digit="8">8</button>
      <button class="key key--digit" data-digit="9">9</button>
      <button class="key key--operator" data-action="multiply">×</button>

      <button class="key key--digit" data-digit="4">4</button>
      <button class="key key--digit" data-digit="5">5</button>
      <button class="key key--digit" data-digit="6">6</button>
      <button class="key key--operator" data-action="subtract">−</button>

      <button class="key key--digit" data-digit="1">1</button>
      <button class="key key--digit" data-digit="2">2</button>
      <button class="key key--digit" data-digit="3">3</button>
      <button class="key key--operator" data-action="add">+</button>

      <button class="key key--digit key--zero" data-digit="0">0</button>
      <button class="key key--digit" data-digit=".">.</button>
      <button class="key key--equals" data-action="equals">=</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
